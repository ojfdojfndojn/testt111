name: build finint v11.75 no obfuscation
on:
  push:
    paths:
      - '.github/workflows/finint-temp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror current FININT site exactly
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/ru dist/en dist/it dist/reports dist/scripts
          wget -q --mirror --page-requisites --no-parent --no-host-directories --directory-prefix=dist --domains=finintcorp.ltd https://finintcorp.ltd/ || true
          curl -fsSL --retry 3 https://finintcorp.ltd/ -o dist/index.html
          curl -fsSL --retry 3 https://finintcorp.ltd/ru/ -o dist/ru/index.html
          curl -fsSL --retry 3 https://finintcorp.ltd/en/ -o dist/en/index.html
          curl -fsSL --retry 3 https://finintcorp.ltd/it/ -o dist/it/index.html
          curl -fsSL --retry 3 https://finintcorp.ltd/scripts/language-router.js -o dist/scripts/language-router.js
          curl -fsSL --retry 3 https://finintcorp.ltd/scripts/mobile-intro.js -o dist/scripts/mobile-intro.js
          for p in public-report-ru.pdf public-report-en.pdf public-report-it.pdf; do curl -fsSL --retry 3 "https://finintcorp.ltd/reports/$p" -o "dist/reports/$p" || true; done
          curl -fsSL --retry 2 https://finintcorp.ltd/robots.txt -o dist/robots.txt || true
          curl -fsSL --retry 2 https://finintcorp.ltd/sitemap.xml -o dist/sitemap.xml || true
      - name: Normalize mirrored asset filenames
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          (function walk(dir){for(const name of fs.readdirSync(dir)){const p=path.join(dir,name),st=fs.statSync(p);if(st.isDirectory()){walk(p);continue}const q=name.indexOf('?');if(q!==-1){const d=path.join(dir,name.slice(0,q));if(!fs.existsSync(d))fs.renameSync(p,d);else fs.unlinkSync(p)}}})('dist');
          NODE
      - name: Add contact email only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const pages=['dist/index.html','dist/ru/index.html','dist/en/index.html','dist/it/index.html'];
          const email='contact@finintcorp.ltd';
          const link='<a class="fib-contact-email" href="mailto:contact@finintcorp.ltd">contact@finintcorp.ltd</a>';
          const css='<style id="fib-contact-email-style">.fib-contact-email{display:inline-block;margin-top:12px;color:#9ca3af;text-decoration:none;font:inherit;font-size:.94em;line-height:1.4;transition:color .18s ease}.fib-contact-email:hover,.fib-contact-email:focus-visible{color:#ffd700}.fib-contact-email:focus-visible{outline:1px solid rgba(255,215,0,.65);outline-offset:4px}</style>';
          for(const file of pages){let html=fs.readFileSync(file,'utf8');if(!html.includes(email)){const marker=/<div\b[^>]*class=["'][^"']*contact-tags[^"']*["'][^>]*>/i;if(!marker.test(html))throw new Error('contact-tags not found in '+file);html=html.replace(marker,link+'$&')}if(!html.includes('fib-contact-email-style'))html=html.replace(/<\/head>/i,css+'</head>');fs.writeFileSync(file,html)}
          NODE
      - name: Verify no obfuscation and preserve intro
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/_headers <<'EOF'
          /*
            X-Content-Type-Options: nosniff
            X-Frame-Options: DENY
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(), geolocation=()
            X-Permitted-Cross-Domain-Policies: none
          EOF
          for f in dist/index.html dist/ru/index.html dist/en/index.html dist/it/index.html; do test -s "$f"; grep -q 'contact@finintcorp.ltd' "$f"; grep -q 'Financial Intelligence Bureau' "$f"; ! grep -q 'fib-loader-state' "$f"; ! grep -q 'f1n1nt-v1174-crossbrowser-safe-loader-2026' "$f"; done
          test -s dist/scripts/mobile-intro.js
          test -s dist/scripts/language-router.js
          test -s dist/reports/public-report-ru.pdf
          test -s dist/reports/public-report-en.pdf
          test -s dist/reports/public-report-it.pdf
      - name: Package complete Cloudflare site
        shell: bash
        run: |
          set -euo pipefail
          rm -f finint-cloudflare-v11-75-no-obfuscation-contact.zip
          (cd dist && zip -qr ../finint-cloudflare-v11-75-no-obfuscation-contact.zip .)
          unzip -t finint-cloudflare-v11-75-no-obfuscation-contact.zip >/dev/null
      - name: Publish build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FININT build bot'
          git config user.email '110449733+ojfdojfndojn@users.noreply.github.com'
          git add -f finint-cloudflare-v11-75-no-obfuscation-contact.zip
          git commit -m 'Build FININT v11.75 no obfuscation contact' || true
          git push origin HEAD:main
