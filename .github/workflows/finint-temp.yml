name: build finint v11.80 exact cursor and feature icons
on:
  push:
    paths:
      - '.github/workflows/finint-temp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v11.80
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist && mkdir dist
          unzip -q finint-cloudflare-v11-78-actual-levels-width-fix.zip -d dist
          mkdir -p dist/assets/r
          curl -fsSL --retry 3 --connect-timeout 10 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-2058-81f4-a9f2-672b7120c783/raw?se=2026-08-12T16%3A48%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=26e8dab1-181f-50ab-851d-e4fd266084bb&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-12T04%3A53%3A24Z&ske=2026-08-13T04%3A53%3A24Z&sks=b&skv=2026-02-06&sig=r6dRM/HqCDTqwiXX3evvKDwFXwIfNJspnQLWTs7mvHM%3D' -o dist/assets/r/finint-cursor.gif
          test -s dist/assets/r/finint-cursor.gif
          file dist/assets/r/finint-cursor.gif | grep -qi 'GIF image data'

          node <<'NODE'
          const fs=require('fs');
          const langs=['ru','en','it'];
          const iconSvgs={
            privacy:`<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#ffd400" stroke-width="2.2" stroke-linecap="round"><path d="M32 11c-9 0-16 7-16 16 0 7-2 11-5 15"/><path d="M32 16c-6 0-11 5-11 11 0 9-3 15-7 19"/><path d="M32 21c-3 0-6 3-6 6 0 11-4 19-9 24"/><path d="M32 26c0 13-4 23-10 29"/><path d="M38 27c0 12-3 22-8 29"/><path d="M43 24c1 13-2 24-7 31"/><path d="M47 20c3 13 1 25-4 34"/><path d="M12 31c1-12 9-22 20-22 8 0 15 4 19 11"/><path d="M52 26c1 9 0 18-3 25"/></svg>`,
            assess:`<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#ffd400" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="30" cy="31" r="3.8"/><circle cx="16" cy="25" r="2.7"/><circle cx="46" cy="19" r="2.7"/><circle cx="38" cy="47" r="2.7"/><circle cx="16" cy="45" r="2.7"/><circle cx="50" cy="39" r="2.7"/><circle cx="28" cy="13" r="2.7"/><path d="M18.6 25.8 26.5 29M33 28.5 43.5 20.7M31.7 34.5 36.5 44.5M27 34 18.3 42.7M33.8 32.7 47.4 38.1M29.5 27.2 28.4 15.7"/></svg>`,
            results:`<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#ffd400" stroke-width="2.1"><circle cx="32" cy="32" r="6"/><circle cx="32" cy="32" r="12"/><circle cx="32" cy="32" r="18"/><circle cx="32" cy="32" r="24"/></svg>`,
            extra:`<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="#ffd400"><circle cx="15" cy="18" r="2.3"/><circle cx="24" cy="13" r="1.8"/><circle cx="33" cy="17" r="2"/><circle cx="44" cy="14" r="2.2"/><circle cx="50" cy="24" r="1.9"/><circle cx="40" cy="25" r="2.5"/><circle cx="28" cy="25" r="2.2"/><circle cx="18" cy="30" r="1.8"/><circle cx="31" cy="35" r="2.6"/><circle cx="46" cy="35" r="2"/><circle cx="52" cy="44" r="2.3"/><circle cx="39" cy="45" r="1.9"/><circle cx="27" cy="46" r="2.2"/><circle cx="16" cy="42" r="2.1"/><circle cx="23" cy="54" r="1.8"/><circle cx="35" cy="55" r="2.2"/><circle cx="46" cy="53" r="1.8"/></svg>`
          };
          const enc=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
          const labels={
            ru:[['Конфиденциальность','privacy'],['Предварительная оценка','assess'],['Структурированный результат','results']],
            en:[['Confidentiality','privacy'],['Preliminary assessment','assess'],['Structured result','results'],['Structured results','results']],
            it:[['Riservatezza','privacy'],['Valutazione preliminare','assess'],['Risultati strutturati','results']]
          };
          for(const lang of langs){
            const f=`dist/scripts/runtime-${lang}.js`;
            let s=fs.readFileSync(f,'utf8');
            s=s.replaceAll('/assets/r/160d2cfb25b35c335e.webp','/assets/r/finint-cursor.gif').replaceAll('/assets/r/616b82468c58bbe60d.gif','/assets/r/finint-cursor.gif');
            const injection=`;(()=>{const ICONS=${JSON.stringify(Object.fromEntries(Object.entries(iconSvgs).map(([k,v])=>[k,enc(v)])))};const MAP=${JSON.stringify(labels[lang])};function apply(){const all=[...document.querySelectorAll('body *')];for(const [txt,key] of MAP){const title=all.find(el=>el.children.length===0&&el.textContent&&el.textContent.trim()===txt);if(!title)continue;let box=title;for(let i=0;i<5&&box;i++,box=box.parentElement){const svg=box.querySelector&&box.querySelector('svg');const img=box.querySelector&&box.querySelector('img');const target=svg||img;if(target){const wrap=document.createElement('span');wrap.className='fibFeatureIcon';wrap.style.backgroundImage='url("'+ICONS[key]+'")';target.replaceWith(wrap);break}}}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply,{once:true});else apply();new MutationObserver(()=>apply()).observe(document.documentElement,{childList:true,subtree:true})})();`;
            s+=injection;
            fs.writeFileSync(f,s);
          }
          const css='dist/assets/r/957bc080ce5bb8bec37b0b.css';
          let c=fs.readFileSync(css,'utf8');
          c+='\n/* v11.80 feature icons */\n.fibFeatureIcon{display:inline-block;width:54px;height:54px;flex:0 0 54px;background-repeat:no-repeat;background-position:center;background-size:contain;filter:drop-shadow(0 0 10px rgba(255,212,0,.08))}@media(max-width:767px){.fibFeatureIcon{width:46px;height:46px;flex-basis:46px}}\n';
          fs.writeFileSync(css,c);
          NODE

      - name: Verify v11.80
        shell: bash
        run: |
          set -euo pipefail
          css='dist/assets/r/957bc080ce5bb8bec37b0b.css'
          grep -Fq '.G01qhMi{display:grid;grid-template-columns:clamp(380px,31vw,410px) minmax(0,1fr);gap:18px;align-items:start}' "$css"
          grep -Fq '.fibFeatureIcon{' "$css"
          test -s dist/assets/r/finint-cursor.gif
          for lang in ru en it; do
            f="dist/scripts/runtime-$lang.js"
            grep -Fq '/assets/r/finint-cursor.gif' "$f"
            grep -Fq 'fibFeatureIcon' "$f"
          done
          for f in dist/index.html dist/ru/index.html dist/en/index.html dist/it/index.html; do
            grep -q 'mailto:contact@finintcorp.ltd' "$f"
          done
          test -s dist/reports/public-report-ru.pdf
          test -s dist/reports/public-report-en.pdf
          test -s dist/reports/public-report-it.pdf
          echo 'v11.80 verified'

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          rm -f finint-cloudflare-v11-80-exact-cursor-feature-icons.zip
          (cd dist && zip -qr ../finint-cloudflare-v11-80-exact-cursor-feature-icons.zip .)
          unzip -t finint-cloudflare-v11-80-exact-cursor-feature-icons.zip >/dev/null

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FININT build bot'
          git config user.email '110449733+ojfdojfndojn@users.noreply.github.com'
          git add -f finint-cloudflare-v11-80-exact-cursor-feature-icons.zip
          git commit -m 'Build FININT v11.80 exact cursor and feature icons' || true
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: finint-cloudflare-v11-80-exact-cursor-feature-icons
          path: finint-cloudflare-v11-80-exact-cursor-feature-icons.zip
          if-no-files-found: error
          retention-days: 7
