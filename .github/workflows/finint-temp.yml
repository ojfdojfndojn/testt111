name: build finint v11.77 levels width fix
on:
  push:
    paths:
      - '.github/workflows/finint-temp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Widen levels navigation and prevent broken words
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist && mkdir dist
          unzip -q finint-cloudflare-v11-76-css-sri-fix.zip -d dist
          node <<'NODE'
          const fs=require('fs');
          const cssFile='dist/assets/r/957bc080ce5bb8bec37b0b.css';
          let css=fs.readFileSync(cssFile,'utf8');

          const oldGrid='.levels-interface{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start}';
          const newGrid='.levels-interface{display:grid;grid-template-columns:clamp(360px,30vw,390px) minmax(0,1fr);gap:18px;align-items:start}';
          if(!css.includes(oldGrid)) throw new Error('desktop levels grid rule not found');
          css=css.replace(oldGrid,newGrid);

          const oldName='.level-nav-name{font-size:0.9rem;font-weight:500;flex:1;overflow-wrap:anywhere}';
          const newName='.level-nav-name{font-size:0.9rem;font-weight:500;flex:1;min-width:0;overflow-wrap:normal;word-break:normal;hyphens:none}';
          if(!css.includes(oldName)) throw new Error('level nav name rule not found');
          css=css.replace(oldName,newName);

          const oldNav='.research-levels-nav{display:flex;flex-direction:column;gap:2px;border:1px solid rgba(255,255,255,0.08);border-radius:12px;overflow:hidden;background:rgba(0,0,0,0.2);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}';
          const newNav='.research-levels-nav{display:flex;flex-direction:column;gap:2px;min-width:0;border:1px solid rgba(255,255,255,0.08);border-radius:12px;overflow:hidden;background:rgba(0,0,0,0.2);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}';
          if(css.includes(oldNav)) css=css.replace(oldNav,newNav);

          const oldView='.research-levels-view{background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:clamp(20px,2.5vw,32px);display:flex;flex-direction:column;gap:24px}';
          const newView='.research-levels-view{min-width:0;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:clamp(20px,2.5vw,32px);display:flex;flex-direction:column;gap:24px}';
          if(css.includes(oldView)) css=css.replace(oldView,newView);

          fs.writeFileSync(cssFile,css);
          NODE
      - name: Verify requested state
        shell: bash
        run: |
          set -euo pipefail
          css='dist/assets/r/957bc080ce5bb8bec37b0b.css'
          test -s "$css"
          grep -Fq 'grid-template-columns:clamp(360px,30vw,390px) minmax(0,1fr);gap:18px' "$css"
          grep -Fq 'overflow-wrap:normal;word-break:normal;hyphens:none' "$css"
          ! grep -Fq 'grid-template-columns:320px 1fr;gap:24px' "$css"
          ! grep -Fq '.level-nav-name{font-size:0.9rem;font-weight:500;flex:1;overflow-wrap:anywhere}' "$css"
          for f in dist/index.html dist/ru/index.html dist/en/index.html dist/it/index.html; do
            test -s "$f"
            grep -q 'mailto:contact@finintcorp.ltd' "$f"
            ! grep -q 'fib-loader-state' "$f"
            ! grep -q 'fib-compat-fallback' "$f"
          done
          test -s dist/reports/public-report-ru.pdf
          test -s dist/reports/public-report-en.pdf
          test -s dist/reports/public-report-it.pdf
          echo 'v11.77 verification passed.'
      - name: Package full Cloudflare site
        shell: bash
        run: |
          set -euo pipefail
          rm -f finint-cloudflare-v11-77-levels-width-fix.zip
          (cd dist && zip -qr ../finint-cloudflare-v11-77-levels-width-fix.zip .)
          unzip -t finint-cloudflare-v11-77-levels-width-fix.zip >/dev/null
          ls -lh finint-cloudflare-v11-77-levels-width-fix.zip
      - name: Publish package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FININT build bot'
          git config user.email '110449733+ojfdojfndojn@users.noreply.github.com'
          git add -f finint-cloudflare-v11-77-levels-width-fix.zip
          git commit -m 'Build FININT v11.77 levels width fix' || true
          git push origin HEAD:main
