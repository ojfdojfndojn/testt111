name: build finint v11.75 clean
on:
  push:
    paths:
      - '.github/workflows/finint-temp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore plain v11.73 payload from v11.74 package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir dist
          unzip -q finint-cloudflare-v11-74-cross-browser-contact.zip -d dist
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const KEY=Buffer.from('f1n1nt-v1174-crossbrowser-safe-loader-2026','utf8');
          function walk(d,out){for(const n of fs.readdirSync(d)){const p=path.join(d,n),s=fs.statSync(p);if(s.isDirectory())walk(p,out);else if(/\.html?$/i.test(n))out.push(p)}}
          function decodeLoader(src,file){
            const pm=src.match(/var p='([^']+)',k='([^']+)',done=false/);
            if(!pm) throw new Error('v11.74 payload not found: '+file);
            const enc=Buffer.from(pm[1],'base64');
            const key=Buffer.from(pm[2],'base64');
            const out=Buffer.alloc(enc.length);
            for(let i=0;i<enc.length;i++) out[i]=enc[i]^key[i%key.length];
            return out.toString('utf8');
          }
          function cleanCompat(html){
            // Remove only the compatibility script injected by v11.74.
            html=html.replace(/<script data-cfasync="false">\(function\(w,d\)\{[\s\S]*?fib-compat-fallback[\s\S]*?\}\)\(window,document\);<\/script>/i,'');
            // Replace the mixed v11.74 style with email-only styling.
            html=html.replace(/<style>\.fib-contact-email\{[\s\S]*?\.fib-compat-fallback \[data-reveal\]\{opacity:1!important;visibility:visible!important;transform:none!important\}<\/style>/i,
              '<style id="fib-contact-email-style">.fib-contact-email{display:inline-flex;margin-top:14px;color:#9ca3af;text-decoration:none;font-size:.92rem;line-height:1.35;letter-spacing:-.01em;transition:color .2s ease,opacity .2s ease}.fib-contact-email:hover,.fib-contact-email:focus-visible{color:#ffd700}.fib-contact-email:focus-visible{outline:1px solid rgba(255,215,0,.65);outline-offset:4px}</style>');
            return html;
          }
          const files=[];walk('dist',files);
          for(const file of files){
            const outer=fs.readFileSync(file,'utf8');
            let html=decodeLoader(outer,file);
            html=cleanCompat(html);
            if(!/contact@finintcorp\.ltd/i.test(html)){
              const link='<a class="fib-contact-email" href="mailto:contact@finintcorp.ltd" aria-label="Email Financial Intelligence Bureau">contact@finintcorp.ltd</a>';
              const re=/(<p\b[^>]*class=["'][^"']*contact-desc[^"']*["'][^>]*>[\s\S]*?<\/p>)/i;
              if(!re.test(html)) throw new Error('contact description not found in decoded '+file);
              html=html.replace(re,'$1'+link);
              if(!html.includes('fib-contact-email-style')) html=html.replace(/<\/head>/i,'<style id="fib-contact-email-style">.fib-contact-email{display:inline-flex;margin-top:14px;color:#9ca3af;text-decoration:none;font-size:.92rem;line-height:1.35;letter-spacing:-.01em;transition:color .2s ease,opacity .2s ease}.fib-contact-email:hover,.fib-contact-email:focus-visible{color:#ffd700}.fib-contact-email:focus-visible{outline:1px solid rgba(255,215,0,.65);outline-offset:4px}</style></head>');
            }
            fs.writeFileSync(file,html);
          }
          console.log('Restored plain HTML files:',files.length);
          NODE

      - name: Verify requested state
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/index.html dist/ru/index.html dist/en/index.html dist/it/index.html; do
            test -s "$f"
            grep -q 'contact@finintcorp.ltd' "$f"
            grep -q 'contact-desc' "$f"
            grep -q 'Financial Intelligence Bureau' "$f"
            ! grep -q 'fib-loader-state' "$f"
            ! grep -q 'f1n1nt-v1174-crossbrowser-safe-loader-2026' "$f"
            ! grep -q 'fib-compat-fallback' "$f"
            ! grep -q 'unable to initialize' "$f"
            ! grep -q 'initialization timeout' "$f"
            ! grep -q "var p='" "$f"
          done
          test -s dist/scripts/mobile-intro.js
          test -s dist/scripts/language-router.js
          test -s dist/reports/public-report-ru.pdf
          test -s dist/reports/public-report-en.pdf
          test -s dist/reports/public-report-it.pdf
          echo 'plain html: yes'
          echo 'contact email: yes'
          echo 'v11.74 outer loader: absent'
          echo 'v11.74 compatibility layer: absent'
          echo 'site intro assets: present'

      - name: Package full Cloudflare site
        shell: bash
        run: |
          set -euo pipefail
          rm -f finint-cloudflare-v11-75-no-obfuscation-contact.zip
          (cd dist && zip -qr ../finint-cloudflare-v11-75-no-obfuscation-contact.zip .)
          unzip -t finint-cloudflare-v11-75-no-obfuscation-contact.zip >/dev/null
          ls -lh finint-cloudflare-v11-75-no-obfuscation-contact.zip

      - name: Publish final package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FININT build bot'
          git config user.email '110449733+ojfdojfndojn@users.noreply.github.com'
          git add -f finint-cloudflare-v11-75-no-obfuscation-contact.zip
          git commit -m 'Build FININT v11.75 clean no obfuscation' || true
          git push origin HEAD:main
