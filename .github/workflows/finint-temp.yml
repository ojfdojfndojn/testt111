name: inspect finint exact markup
on:
  push:
    paths:
      - '.github/workflows/finint-temp.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and print footer contexts
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://finintcorp.ltd/ -o root.html
          curl -fsSL --retry 3 https://finintcorp.ltd/ru/ -o ru.html
          curl -fsSL --retry 3 https://finintcorp.ltd/en/ -o en.html
          curl -fsSL --retry 3 https://finintcorp.ltd/it/ -o it.html
          node <<'NODE'
          const fs=require('fs');
          for(const f of ['root.html','ru.html','en.html','it.html']){
            const s=fs.readFileSync(f,'utf8');
            const needles=['Независимые аналитические исследования','Independent analytical','Independent intelligence','Financial Intelligence Bureau','Corporate Intelligence','Корпоративная разведка','Due Diligence'];
            let idx=-1, needle='';
            for(const n of needles){const x=s.lastIndexOf(n);if(x>idx){idx=x;needle=n}}
            console.log('\n===== '+f+' / '+needle+' @ '+idx+' =====');
            if(idx>=0) console.log(s.slice(Math.max(0,idx-1800),Math.min(s.length,idx+4500)));
            else console.log(s.slice(Math.max(0,s.length-10000)));
          }
          NODE
