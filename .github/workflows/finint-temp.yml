name: publish finint v11.77 artifact
on:
  push:
    paths:
      - '.github/workflows/finint-temp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package exists
        run: |
          test -s finint-cloudflare-v11-77-levels-width-fix.zip
          unzip -t finint-cloudflare-v11-77-levels-width-fix.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: finint-cloudflare-v11-77-levels-width-fix
          path: finint-cloudflare-v11-77-levels-width-fix.zip
          if-no-files-found: error
          retention-days: 7
