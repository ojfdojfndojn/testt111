name: inspect finint live footer
on:
  push:
    paths:
      - '.github/workflows/finint-temp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact live markup
        shell: bash
        run: |
          set -euo pipefail
          for u in '' 'ru/' 'en/' 'it/'; do
            n=$(printf '%s' "$u" | tr '/' '_' ); [ -n "$n" ] || n=root
            curl -fsSL --retry 3 "https://finintcorp.ltd/$u" -o "$n.html"
            echo "===== $n ====="
            echo '--- matching strings ---'
            grep -o -E '.{0,500}(Financial Intelligence Bureau|Независимые аналитические исследования|Corporate Intelligence|Корпоративная разведка|Due Diligence).{0,1200}' "$n.html" | tail -20 || true
            echo '--- last 12000 bytes ---'
            tail -c 12000 "$n.html"
            echo
          done
