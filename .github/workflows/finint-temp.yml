name: check finint css sri
on:
  push:
    paths:
      - '.github/workflows/finint-temp.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check stylesheet integrity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist && mkdir dist
          unzip -q finint-cloudflare-v11-75-no-obfuscation-contact.zip -d dist
          css='dist/assets/r/957bc080ce5bb8bec37b0b.css'
          echo -n 'actual sha384-'
          openssl dgst -sha384 -binary "$css" | openssl base64 -A
          echo
          echo 'declared:'
          grep -o 'integrity="sha384-[^"]*"' dist/ru/index.html | head -1
          echo 'size:'
          wc -c "$css"
          echo 'first bytes:'
          head -c 160 "$css"; echo
