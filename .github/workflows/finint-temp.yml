name: inspect finint cursor assets
on:
  push:
    paths:
      - '.github/workflows/finint-temp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect cursor assets in historical builds
        shell: bash
        run: |
          set -euo pipefail
          for z in finint-cloudflare-v11-74-cross-browser-contact.zip finint-cloudflare-v11-75-no-obfuscation-contact.zip finint-cloudflare-v11-76-css-sri-fix.zip finint-cloudflare-v11-78-actual-levels-width-fix.zip; do
            d="tmp-${z%.zip}"
            rm -rf "$d" && mkdir "$d"
            unzip -q "$z" -d "$d"
            echo "=== $z cursor-like assets ==="
            find "$d" -type f \( -iname '*.gif' -o -iname '*.webp' -o -iname '*cursor*' \) -printf '%P %s bytes\n' | sort || true
            echo "=== runtime cursor refs ==="
            grep -RnoE '/assets/r/[A-Za-z0-9._-]+\.(gif|webp)|finint-animated-cursor[^"'"' ]*' "$d/scripts" 2>/dev/null | head -80 || true
            echo "=== cursor CSS ==="
            grep -RnoE '\.fZHOW5c\{[^}]+\}|\.qU1siwv\{[^}]+\}|\.qUQ83qL\{[^}]+\}|\.hoEGGjE[^\{]*\{[^}]+\}' "$d/assets/r" --include='*.css' | head -100 || true
          done
