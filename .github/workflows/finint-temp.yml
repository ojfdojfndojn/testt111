name: inspect finint stylesheet paths
on:
  push:
    paths:
      - '.github/workflows/finint-temp.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect packaged HTML and assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist && mkdir dist
          unzip -q finint-cloudflare-v11-75-no-obfuscation-contact.zip -d dist
          echo '=== CSS FILES ==='
          find dist -type f \( -name '*.css' -o -name '*.css*' \) -printf '%P\n' | sort | head -200
          echo '=== ROOT HEAD LINKS ==='
          node <<'NODE'
          const fs=require('fs');
          for(const f of ['dist/index.html','dist/ru/index.html','dist/en/index.html','dist/it/index.html']){
            const h=fs.readFileSync(f,'utf8');
            console.log('\n--- '+f+' ---');
            const head=(h.match(/<head[\s\S]*?<\/head>/i)||[''])[0];
            for(const m of head.matchAll(/<(?:link|script)\b[^>]*(?:href|src)=["']([^"']+)["'][^>]*>/ig)) console.log(m[0]);
          }
          NODE
          echo '=== TOP-LEVEL FILES ==='
          find dist -maxdepth 2 -type f -printf '%P\n' | sort | head -300
