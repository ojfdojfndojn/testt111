name: build finint v11.75 clean
on:
  push:
    paths:
      - '.github/workflows/finint-temp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore plain site from v11.74 payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist && mkdir dist
          unzip -q finint-cloudflare-v11-74-cross-browser-contact.zip -d dist
          node <<'NODE'
          const fs=require('fs'), path=require('path');
          function walk(d,out){for(const n of fs.readdirSync(d)){const p=path.join(d,n),s=fs.statSync(p);if(s.isDirectory())walk(p,out);else if(/\.html?$/i.test(n))out.push(p)}}
          function decode(src,file){
            const m=src.match(/var p='([^']+)',k='([^']+)',done=false/);
            if(!m) throw new Error('encrypted v11.74 wrapper missing: '+file);
            const a=Buffer.from(m[1],'base64'),k=Buffer.from(m[2],'base64'),o=Buffer.alloc(a.length);
            for(let i=0;i<a.length;i++)o[i]=a[i]^k[i%k.length];
            return o.toString('utf8');
          }
          function stripV1174(html){
            html=html.replace(/<script data-cfasync="false">\(function\(w,d\)\{[\s\S]*?fib-compat-fallback[\s\S]*?\}\)\(window,document\);<\/script>/i,'');
            html=html.replace(/<style>\.fib-contact-email\{[\s\S]*?\.fib-compat-fallback \[data-reveal\]\{opacity:1!important;visibility:visible!important;transform:none!important\}<\/style>/i,'');
            return html;
          }
          const email='contact@finintcorp.ltd';
          const link='<a class="fib-contact-email" href="mailto:contact@finintcorp.ltd" aria-label="Email Financial Intelligence Bureau">contact@finintcorp.ltd</a>';
          const style='<style id="fib-contact-email-style">.fib-contact-email{display:inline-flex;margin-top:14px;color:#9ca3af;text-decoration:none;font-size:.92rem;line-height:1.35;letter-spacing:-.01em;transition:color .2s ease,opacity .2s ease}.fib-contact-email:hover,.fib-contact-email:focus-visible{color:#ffd700}.fib-contact-email:focus-visible{outline:1px solid rgba(255,215,0,.65);outline-offset:4px}</style>';
          function ensureEmail(html,file){
            // Remove an earlier email copy first, then insert exactly once after the contact description.
            html=html.replace(/<a\b[^>]*class=["'][^"']*fib-contact-email[^"']*["'][^>]*>[\s\S]*?<\/a>/ig,'');
            let re=/(<p\b[^>]*data-i18n=["']contactsDescription["'][^>]*>[\s\S]*?<\/p>)/i;
            if(!re.test(html)) re=/(<p\b[^>]*class=["'][^"']*contact-desc[^"']*["'][^>]*>[\s\S]*?<\/p>)/i;
            if(!re.test(html)) throw new Error('contactsDescription element missing: '+file);
            html=html.replace(re,'$1'+link);
            html=html.replace(/<style id="fib-contact-email-style">[\s\S]*?<\/style>/ig,'');
            html=html.replace(/<\/head>/i,style+'</head>');
            return html;
          }
          const files=[];walk('dist',files);
          for(const file of files){let h=decode(fs.readFileSync(file,'utf8'),file);h=stripV1174(h);h=ensureEmail(h,file);fs.writeFileSync(file,h)}
          console.log('plain pages restored:',files.length);
          NODE
      - name: Verify exact requested state
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/index.html dist/ru/index.html dist/en/index.html dist/it/index.html; do
            test -s "$f"
            [ "$(grep -o 'contact@finintcorp.ltd' "$f" | wc -l)" -ge 2 ]
            grep -q 'data-i18n="contactsDescription"' "$f"
            grep -q 'Financial Intelligence Bureau' "$f"
            ! grep -q 'fib-loader-state' "$f"
            ! grep -q 'f1n1nt-v1174-crossbrowser-safe-loader-2026' "$f"
            ! grep -q 'fib-compat-fallback' "$f"
            ! grep -q 'unable to initialize' "$f"
            ! grep -q 'initialization timeout' "$f"
            ! grep -q "var p='" "$f"
          done
          test -s dist/scripts/mobile-intro.js
          test -s dist/scripts/language-router.js
          test -s dist/reports/public-report-ru.pdf
          test -s dist/reports/public-report-en.pdf
          test -s dist/reports/public-report-it.pdf
          echo 'verified: plain HTML, email all locales, original page intro present, v11.74 wrapper removed'
      - name: Package full site
        shell: bash
        run: |
          set -euo pipefail
          rm -f finint-cloudflare-v11-75-no-obfuscation-contact.zip
          (cd dist && zip -qr ../finint-cloudflare-v11-75-no-obfuscation-contact.zip .)
          unzip -t finint-cloudflare-v11-75-no-obfuscation-contact.zip >/dev/null
          ls -lh finint-cloudflare-v11-75-no-obfuscation-contact.zip
      - name: Publish package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FININT build bot'
          git config user.email '110449733+ojfdojfndojn@users.noreply.github.com'
          git add -f finint-cloudflare-v11-75-no-obfuscation-contact.zip
          git commit -m 'Build FININT v11.75 clean final' || true
          git push origin HEAD:main
