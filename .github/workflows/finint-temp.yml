name: inspect finint v11.77 levels
on:
  push:
    paths:
      - '.github/workflows/finint-temp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual levels markup and CSS
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist && mkdir dist
          unzip -q finint-cloudflare-v11-77-levels-width-fix.zip -d dist
          echo '=== files ==='
          find dist -maxdepth 3 -type f | sort
          echo '=== html levels snippets ==='
          grep -RniE 'levels-interface|level-nav|research-level|Уровни аналитических исследований|Индивидуальное исследование|После оценки запроса' dist --include='*.html' --include='*.js' | head -240 || true
          echo '=== css selector hits ==='
          grep -RnoE '\.[A-Za-z0-9_-]*(level|research)[A-Za-z0-9_-]*\{[^}]{0,500}\}' dist --include='*.css' | head -300 || true
          echo '=== relevant all css fragments ==='
          for f in $(find dist -type f -name '*.css'); do
            echo "--- $f ---"
            tr '}' '}\n' < "$f" | grep -Ei 'level|research' | head -240 || true
          done
