name: build finint v11.81 exact user assets
on:
  push:
    paths:
      - '.github/workflows/finint-temp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v11.81
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist && mkdir dist
          unzip -q finint-cloudflare-v11-78-actual-levels-width-fix.zip -d dist
          mkdir -p dist/assets/r

          curl -fsSL --retry 3 --connect-timeout 10 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-aee4-820a-869e-4994b4f83eac/raw?se=2026-08-12T16%3A58%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=fc81ec18-16b6-5d87-ba2a-9e87c3ba8308&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-12T04%3A19%3A37Z&ske=2026-08-13T04%3A19%3A37Z&sks=b&skv=2026-02-06&sig=diUfbGjyTS9KCEVhDVd4RdOW2UKlAOaWZf5ZBBCHNTA%3D' -o dist/assets/r/finint-cursor.gif
          curl -fsSL --retry 3 --connect-timeout 10 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-8d34-8246-bd29-dba431bb4a91/raw?se=2026-08-12T16%3A56%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=52532dd1-068d-52a7-9ee7-84a21f2597e4&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-12T04%3A43%3A25Z&ske=2026-08-13T04%3A43%3A25Z&sks=b&skv=2026-02-06&sig=0K/Ac6WcLciGioN7Bz2%2BjBqlLxfHwDwNCz%2BcTMBOVmY%3D' -o dist/assets/r/feature-privacy.webp
          curl -fsSL --retry 3 --connect-timeout 10 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-4a8c-8246-9f68-76867c13a842/raw?se=2026-08-12T16%3A57%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=f352c368-e1f6-549e-b356-b245b7ff2ce9&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-12T16%3A11%3A04Z&ske=2026-08-13T16%3A11%3A04Z&sks=b&skv=2026-02-06&sig=Y9gZDsuokFyJJdILtSIUaIpFzFPvYoxnOJjCzIS5cSE%3D' -o dist/assets/r/feature-assessment.webp
          curl -fsSL --retry 3 --connect-timeout 10 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-4fd0-81f4-a89d-df060f651382/raw?se=2026-08-12T16%3A57%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=37e51f20-c9f3-5e1a-975c-10212e3e7f32&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-12T07%3A46%3A08Z&ske=2026-08-13T07%3A46%3A08Z&sks=b&skv=2026-02-06&sig=lGsiKz1lUq8ATO8F72B4utO0PW5Op2dMsz9MmRX7FkQ%3D' -o dist/assets/r/feature-results.webp

          file dist/assets/r/finint-cursor.gif | grep -qi 'GIF image data'
          for f in feature-privacy.webp feature-assessment.webp feature-results.webp; do test -s "dist/assets/r/$f"; done

          node <<'NODE'
          const fs=require('fs');
          const langs=['ru','en','it'];
          const labels={
            ru:[['Конфиденциальность','/assets/r/feature-privacy.webp'],['Предварительная оценка','/assets/r/feature-assessment.webp'],['Структурированный результат','/assets/r/feature-results.webp']],
            en:[['Confidentiality','/assets/r/feature-privacy.webp'],['Preliminary assessment','/assets/r/feature-assessment.webp'],['Structured result','/assets/r/feature-results.webp'],['Structured results','/assets/r/feature-results.webp']],
            it:[['Riservatezza','/assets/r/feature-privacy.webp'],['Valutazione preliminare','/assets/r/feature-assessment.webp'],['Risultati strutturati','/assets/r/feature-results.webp']]
          };
          for(const lang of langs){
            const f=`dist/scripts/runtime-${lang}.js`;
            let s=fs.readFileSync(f,'utf8');
            s=s.replaceAll('/assets/r/160d2cfb25b35c335e.webp','/assets/r/finint-cursor.gif').replaceAll('/assets/r/616b82468c58bbe60d.gif','/assets/r/finint-cursor.gif');
            const injection=`;(()=>{const MAP=${JSON.stringify(labels[lang])};function apply(){const all=[...document.querySelectorAll('body *')];for(const [txt,src] of MAP){const title=all.find(el=>el.children.length===0&&el.textContent&&el.textContent.trim()===txt);if(!title)continue;let box=title;for(let i=0;i<6&&box;i++,box=box.parentElement){const target=box.querySelector&&box.querySelector('svg,img');if(target&&!target.classList.contains('fibFeatureIcon')){const img=document.createElement('img');img.src=src;img.alt='';img.className='fibFeatureIcon';img.decoding='async';target.replaceWith(img);break}}}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply,{once:true});else apply();new MutationObserver(apply).observe(document.documentElement,{childList:true,subtree:true})})();`;
            s+=injection;
            fs.writeFileSync(f,s);
          }
          const css='dist/assets/r/957bc080ce5bb8bec37b0b.css';
          let c=fs.readFileSync(css,'utf8');
          c+='\n/* v11.81 exact supplied feature icons */\n.fibFeatureIcon{display:block;width:54px;height:54px;object-fit:contain;object-position:center;flex:0 0 54px;background:transparent!important;border:0!important;box-shadow:none!important}@media(max-width:767px){.fibFeatureIcon{width:46px;height:46px;flex-basis:46px}}\n';
          fs.writeFileSync(css,c);
          NODE

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          css='dist/assets/r/957bc080ce5bb8bec37b0b.css'
          grep -Fq '.G01qhMi{display:grid;grid-template-columns:clamp(380px,31vw,410px) minmax(0,1fr);gap:18px;align-items:start}' "$css"
          grep -Fq '.fibFeatureIcon{' "$css"
          test -s dist/assets/r/finint-cursor.gif
          test -s dist/assets/r/feature-privacy.webp
          test -s dist/assets/r/feature-assessment.webp
          test -s dist/assets/r/feature-results.webp
          for lang in ru en it; do
            grep -Fq '/assets/r/finint-cursor.gif' "dist/scripts/runtime-$lang.js"
            grep -Fq '/assets/r/feature-privacy.webp' "dist/scripts/runtime-$lang.js"
          done
          for f in dist/index.html dist/ru/index.html dist/en/index.html dist/it/index.html; do grep -q 'mailto:contact@finintcorp.ltd' "$f"; done
          test -s dist/reports/public-report-ru.pdf
          test -s dist/reports/public-report-en.pdf
          test -s dist/reports/public-report-it.pdf

      - name: Package and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f finint-cloudflare-v11-81-exact-user-assets.zip
          (cd dist && zip -qr ../finint-cloudflare-v11-81-exact-user-assets.zip .)
          unzip -t finint-cloudflare-v11-81-exact-user-assets.zip >/dev/null
          git config user.name 'FININT build bot'
          git config user.email '110449733+ojfdojfndojn@users.noreply.github.com'
          git add -f finint-cloudflare-v11-81-exact-user-assets.zip
          git commit -m 'Build FININT v11.81 exact user assets' || true
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: finint-cloudflare-v11-81-exact-user-assets
          path: finint-cloudflare-v11-81-exact-user-assets.zip
          if-no-files-found: error
          retention-days: 7
