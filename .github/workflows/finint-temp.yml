name: build finint v11.77 levels width fix
on:
  push:
    paths:
      - '.github/workflows/finint-temp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Widen levels navigation and prevent broken words
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist && mkdir dist
          unzip -q finint-cloudflare-v11-76-css-sri-fix.zip -d dist
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const cssDir='dist/assets/r';
          const cssFile=fs.readdirSync(cssDir).filter(x=>x.endsWith('.css')).map(x=>path.join(cssDir,x)).sort((a,b)=>fs.statSync(b).size-fs.statSync(a).size)[0];
          let css=fs.readFileSync(cssFile,'utf8');
          let changed=0;

          css=css.replace(/\.levels-interface\{display:grid;grid-template-columns:[^;}]+;gap:[^;}]+;align-items:start\}/, m=>{
            changed++;
            return '.levels-interface{display:grid;grid-template-columns:clamp(360px,30vw,390px) minmax(0,1fr);gap:18px;align-items:start}';
          });

          css=css.replace(/\.level-nav-name\{([^}]*)\}/, (m,body)=>{
            changed++;
            body=body.replace(/overflow-wrap:[^;]+;?/g,'').replace(/word-break:[^;]+;?/g,'').replace(/hyphens:[^;]+;?/g,'').replace(/min-width:[^;]+;?/g,'');
            if(body && !body.endsWith(';')) body+=';';
            return `.level-nav-name{${body}min-width:0;overflow-wrap:normal;word-break:normal;hyphens:none}`;
          });

          css=css.replace(/\.research-levels-nav\{([^}]*)\}/, (m,body)=>{
            if(/min-width:/.test(body)) return m;
            changed++;
            return `.research-levels-nav{min-width:0;${body}}`;
          });

          css=css.replace(/\.research-levels-view\{([^}]*)\}/, (m,body)=>{
            if(/min-width:/.test(body)) return m;
            changed++;
            return `.research-levels-view{min-width:0;${body}}`;
          });

          if(changed < 2) {
            console.error('Not enough CSS rules matched. changed=',changed);
            const hits=css.match(/\.(?:levels-interface|level-nav-name|research-levels-nav|research-levels-view)\{[^}]*\}/g)||[];
            console.error(hits.join('\n'));
            process.exit(1);
          }
          fs.writeFileSync(cssFile,css);
          console.log('patched',cssFile,'rules',changed);
          NODE
      - name: Verify requested state
        shell: bash
        run: |
          set -euo pipefail
          css=$(find dist/assets/r -maxdepth 1 -type f -name '*.css' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          grep -Fq 'grid-template-columns:clamp(360px,30vw,390px) minmax(0,1fr);gap:18px' "$css"
          grep -Fq 'overflow-wrap:normal;word-break:normal;hyphens:none' "$css"
          for f in dist/index.html dist/ru/index.html dist/en/index.html dist/it/index.html; do
            test -s "$f"
            grep -q 'mailto:contact@finintcorp.ltd' "$f"
            ! grep -q 'fib-loader-state' "$f"
            ! grep -q 'fib-compat-fallback' "$f"
          done
          test -s dist/reports/public-report-ru.pdf
          test -s dist/reports/public-report-en.pdf
          test -s dist/reports/public-report-it.pdf
          echo 'v11.77 verification passed.'
      - name: Package full Cloudflare site
        shell: bash
        run: |
          set -euo pipefail
          rm -f finint-cloudflare-v11-77-levels-width-fix.zip
          (cd dist && zip -qr ../finint-cloudflare-v11-77-levels-width-fix.zip .)
          unzip -t finint-cloudflare-v11-77-levels-width-fix.zip >/dev/null
      - name: Publish package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FININT build bot'
          git config user.email '110449733+ojfdojfndojn@users.noreply.github.com'
          git add -f finint-cloudflare-v11-77-levels-width-fix.zip
          git commit -m 'Build FININT v11.77 levels width fix' || true
          git push origin HEAD:main
