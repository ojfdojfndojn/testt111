name: build finint v11.79 cursor fixed
on:
  push:
    paths:
      - '.github/workflows/finint-temp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make cursor self-contained
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist && mkdir dist
          unzip -q finint-cloudflare-v11-78-actual-levels-width-fix.zip -d dist
          node <<'NODE'
          const fs=require('fs');
          for(const lang of ['ru','en','it']){
            const f=`dist/scripts/runtime-${lang}.js`;
            let s=fs.readFileSync(f,'utf8');
            const start=s.indexOf('(()=>{if(!window.matchMedia("(pointer:fine) and (min-width:768px)").matches)return;');
            const marker='(function(){const l=document.getElementById("NpEuVGmR")';
            const end=s.indexOf(marker,start);
            if(start<0 || end<0) throw new Error('cursor block not found: '+lang);
            const replacement=`(()=>{if(!window.matchMedia("(pointer:fine) and (min-width:768px)").matches)return;const l=document.createElement("span");l.className="fZHOW5c fibCssCursor";l.setAttribute("aria-hidden","true");document.body.appendChild(l);const B="input,textarea,select,[contenteditable='true'],.M6DF1ou:disabled";let b=-100,h=-100,C=null,A=0,E=false;const P=()=>{A=0;l.style.transform=\`translate3d(\${b-10}px,\${h-10}px,0)\`},K=g=>{if(g!==C){C=g;l.classList.toggle("qU1siwv",g instanceof Element&&!!g.closest(B))}},w=()=>{if(!E){E=true;l.classList.add("qUQ83qL")}},x=()=>{if(E){E=false;l.classList.remove("qUQ83qL")}},d=g=>{if(g.pointerType&&g.pointerType!=="mouse")return;const L=typeof g.getCoalescedEvents==="function"?g.getCoalescedEvents():null,m=L&&L.length?L[L.length-1]:g;b=m.clientX;h=m.clientY;if(!A){l.style.transform=\`translate3d(\${b-10}px,\${h-10}px,0)\`;A=requestAnimationFrame(P)}w()};document.documentElement.classList.add("hoEGGjE");"onpointerrawupdate" in window?document.addEventListener("pointerrawupdate",d,{passive:true}):document.addEventListener("pointermove",d,{passive:true});document.addEventListener("pointerover",g=>K(g.target),{passive:true});document.addEventListener("pointerleave",x,{passive:true});window.addEventListener("blur",x,{passive:true})})();`;
            s=s.slice(0,start)+replacement+s.slice(end);
            fs.writeFileSync(f,s);
          }
          const cssFile='dist/assets/r/957bc080ce5bb8bec37b0b.css';
          let css=fs.readFileSync(cssFile,'utf8');
          css+='\n/* v11.79 self-contained cursor */\n.fZHOW5c.fibCssCursor{position:fixed!important;left:0!important;top:0!important;display:block!important;width:20px!important;height:20px!important;max-width:none!important;max-height:none!important;border:1px solid rgba(255,215,0,.92)!important;border-radius:50%!important;background:rgba(4,4,4,.34)!important;box-shadow:0 0 0 1px rgba(0,0,0,.42),0 0 14px rgba(255,215,0,.18)!important;pointer-events:none!important;z-index:2147483647!important;opacity:0!important;transform:translate3d(-100px,-100px,0);transition:width .15s ease,height .15s ease,background .15s ease,opacity .12s ease!important;will-change:transform!important}.fZHOW5c.fibCssCursor.qUQ83qL{opacity:1!important}.fZHOW5c.fibCssCursor:after{content:"";position:absolute;width:4px;height:4px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:#ffd700}.fZHOW5c.fibCssCursor.qU1siwv{width:14px!important;height:14px!important;background:rgba(255,215,0,.12)!important}@media (pointer:coarse),(max-width:767px){.fZHOW5c.fibCssCursor{display:none!important}}\n';
          fs.writeFileSync(cssFile,css);
          NODE
      - name: Verify cursor and preserved layout
        shell: bash
        run: |
          set -euo pipefail
          css='dist/assets/r/957bc080ce5bb8bec37b0b.css'
          grep -Fq '.fZHOW5c.fibCssCursor{' "$css"
          grep -Fq '.G01qhMi{display:grid;grid-template-columns:clamp(380px,31vw,410px) minmax(0,1fr);gap:18px;align-items:start}' "$css"
          for lang in ru en it; do
            f="dist/scripts/runtime-$lang.js"
            grep -Fq 'fibCssCursor' "$f"
            ! grep -Fq '160d2cfb25b35c335e.webp' "$f"
            ! grep -Fq '616b82468c58bbe60d.gif' "$f"
          done
          for f in dist/index.html dist/ru/index.html dist/en/index.html dist/it/index.html; do
            grep -q 'mailto:contact@finintcorp.ltd' "$f"
          done
          test -s dist/reports/public-report-ru.pdf
          test -s dist/reports/public-report-en.pdf
          test -s dist/reports/public-report-it.pdf
          echo 'cursor and v11.78 layout verified'
      - name: Package full site
        shell: bash
        run: |
          set -euo pipefail
          rm -f finint-cloudflare-v11-79-cursor-fixed.zip
          (cd dist && zip -qr ../finint-cloudflare-v11-79-cursor-fixed.zip .)
          unzip -t finint-cloudflare-v11-79-cursor-fixed.zip >/dev/null
      - name: Commit package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FININT build bot'
          git config user.email '110449733+ojfdojfndojn@users.noreply.github.com'
          git add -f finint-cloudflare-v11-79-cursor-fixed.zip
          git commit -m 'Build FININT v11.79 cursor fixed' || true
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: finint-cloudflare-v11-79-cursor-fixed
          path: finint-cloudflare-v11-79-cursor-fixed.zip
          if-no-files-found: error
          retention-days: 7
