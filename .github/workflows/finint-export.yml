name: export finint v11.74 direct
on:
  push:
    paths:
      - '.github/workflows/finint-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare direct site archive
        shell: bash
        run: |
          set -euo pipefail
          test -s finint-cloudflare-v11-74-cross-browser-contact.zip
          unzip -t finint-cloudflare-v11-74-cross-browser-contact.zip >/dev/null
          rm -rf export-site
          mkdir export-site
          unzip -q finint-cloudflare-v11-74-cross-browser-contact.zip -d export-site
          test -s export-site/index.html
          test -s export-site/ru/index.html
          test -s export-site/en/index.html
          test -s export-site/it/index.html
          test -s export-site/reports/public-report-ru.pdf
          test -s export-site/reports/public-report-en.pdf
          test -s export-site/reports/public-report-it.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: finint-cloudflare-v11-74-direct
          path: export-site/
          retention-days: 7
          compression-level: 6
          include-hidden-files: true
